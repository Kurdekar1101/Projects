<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">


  <title>Frontend Mentor | Product preview card component</title>

</head>

<body>
  <section class="main-section">
    <section class="img-section">
      <picture>
        <source media="(max-width: 375px)" srcset="./images/image-product-mobile.jpg">
        <img src="./images/image-product-desktop.jpg" alt="Product image">
      </picture>
      <!-- <img src="./images/image-product-desktop.jpg" alt="Product image"> -->
    </section>

    <section class="info-section">
      <p id="prod-type">PERFUME</p>

      <h1 id="prod-name">Gabrielle Essence Eau De Parfum</h1>

      <p id="prod-description">
        A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.
      </p>

      <div id="prod-price">
        <p id="sell-price">$149.99</p>
        <p id="cost-price">$169.99</p>
      </div>

      <button class="cart-btn">
        <img src="./images/icon-cart.svg"> &nbsp;&nbsp;
        <span>Add to Cart</span>
      </button>

    </section>
  </section>
</body>

</html>
